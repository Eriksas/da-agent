# 每次 push / PR 自动运行。全程使用假模型，不需要任何密钥。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0  # 该项目只发布完整版本号标签，没有 v10 这种浮动标签
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        # langgraph 是可选依赖组，只给 M3b 的对照测试用；主流程和每周周报都不装它
        run: uv sync --locked --group langgraph

      - name: Scan for accidentally committed secrets
        run: uv run python -m da_agent.secret_scan

      - name: Unit tests
        run: uv run --group langgraph pytest -q

      - name: Demo with fake LLM
        run: uv run da-agent demo --llm fake
