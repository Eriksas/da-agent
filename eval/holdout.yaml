# 留出题（2026-10-07 冻结）
#
# 用途：检验 M7b 的改进能不能推广到没见过的题。cases.yaml 的 10 道题已经用来找问题、定改进方向，
# 在那些题上的提升有一部分是“对症修出来的”；这 5 道题在改代码之前写好并单独提交，
# 之后不针对它们改代码、提示词或分析流程。
#
# 流程：冻结 → 用改进前的代码跑一遍（改进前成绩）→ 改代码 → 再跑一遍（改进后成绩）。
# 如果事后发现评分规则本身有缺陷（M6 出现过），修改要写明日期和原因，
# 并对改进前、改进后的结果用同一套规则重新评分，两种结果都保留。
#
# 字段含义见 cases.yaml 开头的说明。题目里的事实（下面的注释）由程序查询得到，评分时不用。

cases:
  - id: w03-cancelled-order
    category: 陷阱：被取消的极端大单（完整周）
    # GMV 环比 +11.77%，但含发票 541431（77,183.60），24 小时内被等量取消；净销售额 −29.44%，订单数 −11.24%
    question: 2011-W03 的 GMV 环比涨了一成多，是不是卖得更好了？
    must_mention:
      - ["541431", "极端", "大额", "77,183.60"]
      - ["取消"]
      - ["净销售额"]

  - id: w22-bank-holiday
    category: 陷阱：交易天数不同（银行假日）
    # 5 个交易日对上周 6 个（2011-05-30 银行假日）；GMV −27.84%，按日均 −13.41%；目前工具不对此发出警告
    question: 2011-W22 的 GMV 环比降了近三成，业务出了什么问题？
    must_mention:
      - ["少一天", "少了一天", "少 1 天", "少了 1 天", "交易天数少", "交易天数减少", "交易日减少", "交易日少",
         "只有 5 天", "5 天 vs", "5 天对 6 天", "5 个交易日", "交易天数不同", "天数不同", "日均",
         "节假日", "假期", "假日", "bank holiday"]

  - id: au-small-sample
    category: 陷阱：小样本
    # 澳大利亚 GMV 16,727 → 211（取整），两周各只有 1 单；全站 GMV +1.13%
    question: 2011-W10 澳大利亚的 GMV 跌了这么多，澳洲市场出问题了吗？
    must_mention:
      - ["样本不足", "样本太少", "小样本", "少于 30", "偶然", "只有 1 单", "各 1 单", "各只有 1 单", "1 单", "一单"]

  - id: w41-why
    category: 常规诊断
    # GMV −28.84%，交易天数相同、没有警告；Shapley 拆解中客单价贡献 72.26%，老客贡献 95.77%
    question: 2011-W41 的 GMV 为什么下降？
    must_mention:
      - ["2011-W41"]
      - ["客单价"]
    must_not:
      - "全靠"

  - id: ab-not-significant
    category: 实验：不显著
    # 6.0% vs 6.5%，p = 0.1914，95% 置信区间 [−0.25pp, +1.25pp]；分流比例正常
    question: 我们测试了新版商品详情页，按 50/50 分流：对照组 8000 人中 480 人下单，实验组 8000 人中 520 人下单。新版本更好吗？
    expects_skill: false
    must_mention:
      # 2026-10-07 改进前、改进后都跑完后补充“置信区间跨过 0”“significant = false”等说法：
      # 改进前有一份答案用这两种说法正确说明了不显著，原同义词表没有覆盖。改进前后的结果都按新规则重新评分。
      - ["不显著", "没有统计显著", "未达到显著", "不具有统计显著", "不具备统计显著", "没有达到显著", "并不显著",
         "没有统计学显著", "未达到统计学显著", "不具有统计学显著", "不具备统计学显著",
         "significant = false", "significant=false", "significant: false", "跨过 0", "跨过0", "跨越 0", "包含 0", "包含0"]
      - ["p 值", "p值", "p=", "p =", "P 值", "P值"]
