# 看板 Agent 接进主 Agent 的开发题（M22）：写提示词时用，成绩不算数。格式同 dashboard_route.yaml。
domain: ecommerce
cases:
  - id: dev-dash-finance
    category: 要看板
    question: 帮我搭个看板，给财务看 2010 年整体的销售情况。
    expects_skill: false
    require_tools: [build_dashboard]
    must_mention:
      - ["dashboard.html"]
  - id: dev-ask-orders
    category: 只是提问
    question: 2011-W47 的订单数是多少？
    expects_skill: false
    forbid_tools: [build_dashboard]
  - id: dev-ask-aov
    category: 只是提问
    question: 2011 年哪个国家的客单价最高？
    expects_skill: false
    forbid_tools: [build_dashboard]
