# 多模型对比（M16）的计划：三个模型、三套题。结果目录是 eval/results/<prefix>-<模型 id>-<套题 id>。
prefix: models-2026-11-11
models:
  - {id: flash, model: MiniMax-M3.1-Flash-Preview, note: 项目一直在用的模型}
  - {id: m3, model: MiniMax-M3, note: 同一厂商更大的模型}
  - {id: m27, model: MiniMax-M2.7, note: 同一厂商上一代的模型}
suites:
  - {id: cases, label: 原题（10 道）, case_file: eval/cases.yaml, conditions: [baseline, agent, agent_skill]}
  - {id: holdout, label: 留出题（5 道）, case_file: eval/holdout.yaml, conditions: [agent, agent_skill]}
  - {id: company, label: 财报（8 道）, case_file: eval/company_cases.yaml, conditions: [baseline, agent_skill]}
