# 看板 Agent 接进主 Agent 的评测题（M22）：主 Agent 能不能分清“要看板”和“只是在提问”，要看板时能不能交出一个看板。
#
# 评分规则同 cases.yaml，另加：
#   require_tools  必须成功调用的工具（调了但看板没搭出来也不算）
#   forbid_tools   不能调用的工具（试着调用就算错）
# 要看板的题要求回答里给出页面位置（dashboard.html）。只是提问的题不检查答案对不对（以前的评测已经测过），只看有没有误搭看板、数字有没有出处。
#
# 这 8 道题在提示词和评分定下来之后才第一次用模型跑，只跑一次。
domain: ecommerce
cases:
  - id: r-dash-countries
    category: 要看板
    question: 帮我做一个看板，给运营负责人看 2011 年各国的销售和取消情况。
    expects_skill: false
    require_tools: [build_dashboard]
    must_mention:
      - ["dashboard.html"]
  - id: r-dash-customers
    category: 要看板
    question: 我想每周复盘一下新老客户的情况，能不能搭个仪表盘？
    expects_skill: false
    require_tools: [build_dashboard]
    must_mention:
      - ["dashboard.html"]
  - id: r-dash-products
    category: 要看板
    question: 老板要一个看商品的 dashboard：哪些商品卖得好、哪些被取消得多。
    expects_skill: false
    require_tools: [build_dashboard]
    must_mention:
      - ["dashboard.html"]
  - id: r-dash-page
    category: 要看板（没说“看板”）
    question: 做个页面，我想随时打开看看各月的 GMV 走势和客单价。
    expects_skill: false
    require_tools: [build_dashboard]
    must_mention:
      - ["dashboard.html"]
  - id: r-ask-wow
    category: 只是提问
    question: 2011-W48 的 GMV 环比怎么样？
    expects_skill: false
    forbid_tools: [build_dashboard]
  - id: r-ask-weekday
    category: 只是提问
    question: 2011 年 11 月，一周里哪天卖得最好？
    expects_skill: false
    forbid_tools: [build_dashboard]
  - id: r-ask-why
    category: 只是提问
    question: 上周 GMV 为什么变化？
    forbid_tools: [build_dashboard]
  - id: r-ask-ranking
    category: 只是提问（说了“给我看”）
    question: 给我看一下 2011 年各国的 GMV 排名。
    expects_skill: false
    forbid_tools: [build_dashboard]
