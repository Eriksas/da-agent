# 看板 Agent 和查询 Agent 共用口径配置的评测题（M23）：看板 Agent 换到口径配置的表之后，
# 以前搭不出来的看板（新老客）能不能搭出来，以前能搭的有没有变差，口径是不是和查询、固定报表一致。
#
# 评分规则同 dashboard_route.yaml，另加两条（只看看板 Agent 最后一次通过检查的方案，一次回答搭了两个看板时有一个满足就算）：
#   dashboard_columns  方案里必须用到的列（指标的 column / where、图的横轴 / 分组、筛选器都算）
#   dashboard_metrics  方案里必须有按口径配置算的这些指标（叫什么名字都行，定义和 semantic/retail.yaml 一致）
#
# 前 4 道要看板、后 4 道只是提问的题和 M22 的留出题一字不差，用来和 M22 比较；中间 2 道是新题。
# 这 10 道题在评分标准定下来、提交之后才第一次用模型跑。
domain: ecommerce
cases:
  - id: s-dash-countries
    category: 要看板（M22 原题）
    question: 帮我做一个看板，给运营负责人看 2011 年各国的销售和取消情况。
    expects_skill: false
    require_tools: [build_dashboard]
    must_mention:
      - ["dashboard.html"]
  - id: s-dash-customers
    category: 要看板（M22 原题，M22 两次都没做到）
    question: 我想每周复盘一下新老客户的情况，能不能搭个仪表盘？
    expects_skill: false
    require_tools: [build_dashboard]
    dashboard_columns: [customer_type]
    must_mention:
      - ["dashboard.html"]
  - id: s-dash-products
    category: 要看板（M22 原题）
    question: 老板要一个看商品的 dashboard：哪些商品卖得好、哪些被取消得多。
    expects_skill: false
    require_tools: [build_dashboard]
    must_mention:
      - ["dashboard.html"]
  - id: s-dash-page
    category: 要看板（M22 原题，没说“看板”）
    question: 做个页面，我想随时打开看看各月的 GMV 走势和客单价。
    expects_skill: false
    require_tools: [build_dashboard]
    dashboard_metrics: [gmv, aov]
    must_mention:
      - ["dashboard.html"]
  - id: s-dash-members
    category: 要看板（新题：只有口径配置的表才有的列）
    question: 给会员运营搭一个看板：2011 年每个月来了多少新客、老客回来买了多少，新客主要来自哪些国家。
    expects_skill: false
    require_tools: [build_dashboard]
    dashboard_columns: [customer_type, country]
    must_mention:
      - ["dashboard.html"]
  - id: s-dash-weekly
    category: 要看板（新题：口径一致）
    question: 做一个周会用的看板，每周看 GMV、净销售额、订单数和客单价。
    expects_skill: false
    require_tools: [build_dashboard]
    dashboard_metrics: [gmv, net_sales, orders, aov]
    must_mention:
      - ["dashboard.html"]
  - id: s-ask-wow
    category: 只是提问（M22 原题）
    question: 2011-W48 的 GMV 环比怎么样？
    expects_skill: false
    forbid_tools: [build_dashboard]
  - id: s-ask-weekday
    category: 只是提问（M22 原题）
    question: 2011 年 11 月，一周里哪天卖得最好？
    expects_skill: false
    forbid_tools: [build_dashboard]
  - id: s-ask-why
    category: 只是提问（M22 原题）
    question: 上周 GMV 为什么变化？
    forbid_tools: [build_dashboard]
  - id: s-ask-ranking
    category: 只是提问（M22 原题，说了“给我看”）
    question: 给我看一下 2011 年各国的 GMV 排名。
    expects_skill: false
    forbid_tools: [build_dashboard]
