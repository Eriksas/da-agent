# 评测题集
#
# 每道题的评分规则（全部由程序自动判断）：
#   must_mention  必须提到的要点。每一项是一组可以互换的说法，答案里出现其中任意一个就算提到。
#   must_not      不能出现的说法（正则表达式）。出现就算违规。
#   expect_value  答案里必须出现的正确数值。数值由程序在评测时用工具现算，不手写。
#   inject        在真实数据的副本上注入已知异动（例如删除某国某周的全部订单），用来检验归因能力。
#
# 一道题“通过”需要同时满足：运行正常结束；要点全部提到；没有违规说法；
# 所有数字都能找到出处；expect_value 出现在答案里。
#
# 关键词评分是近似的：同义表述可能漏判，否定句（“不能说实验组赢了”）可能误判。
# 所以评测结果会抽样人工复核，并报告自动评分与人工判断的一致程度。

cases:
  - id: w48-why
    category: 常规诊断
    question: 上周 GMV 为什么变化？
    must_mention:
      - ["2011-W48"]
      - ["客单价"]
      - ["活跃客户", "客户数"]
    must_not:
      - "全靠"

  - id: w49-trap
    category: 陷阱：不完整周 + 极端大单
    question: 2011-W49 的 GMV 大涨，是好消息吗？
    must_mention:
      - ["不完整"]
      - ["581483", "极端", "大额"]
      - ["净销售额"]
    must_not:
      - "(主体|整体|大盘|基本盘)(业务)?(是|在|正在)?(下滑|下降|变差|萎缩|没有变好|并未变好)"

  - id: w01-closure
    category: 陷阱：基期整周停业
    question: 2011-W01 的 GMV 环比变化怎么看？
    must_mention:
      - ["停业", "没有交易", "无交易", "交易天数为 0", "为 0"]

  - id: early-new-customers
    category: 陷阱：新客被高估（左删失）
    question: 2010-W10 的新客多不多？和上周比有什么变化？
    must_mention:
      - ["数据起点", "起点之前", "算成新客", "左删失", "高估"]

  - id: nl-small-sample
    category: 陷阱：小样本
    question: 2011-W48 荷兰的 GMV 为什么跌了这么多？
    must_mention:
      - ["样本不足", "样本太少", "小样本", "少于 30", "偶然"]

  - id: out-of-range
    category: 应该拒答：超出数据范围
    question: 2012-W10 的 GMV 是多少？
    must_mention:
      - ["不在数据范围", "超出", "数据范围", "没有这一周", "没有该周"]

  - id: quick-orders
    category: 查一个数
    question: 2011-W45 的订单数是多少？
    expect_value: {week: "2011-W45", metric: orders}

  - id: ab-significant
    category: 实验：显著性
    question: 我们做了一个满减实验，按 50/50 分流：对照组 5000 人中 400 人下单，实验组 5000 人中 460 人下单。效果显著吗？
    must_mention:
      - ["显著"]
      - ["p 值", "p值", "p=", "p =", "P 值"]
    must_not:
      - "不显著"

  - id: ab-srm
    category: 陷阱：样本比例失衡
    question: 我们做了一个满减实验，按 50/50 分流：对照组 5000 人中 400 人下单，实验组 5600 人中 480 人下单。实验组赢了吗？
    must_mention:
      - ["样本比例失衡", "比例失衡", "SRM", "分流异常", "分流有问题", "分流可能有问题", "分流比例"]

  - id: injected-eire
    category: 注入异动：国家归因
    question: 2011-W31 的 GMV 环比下降了，主要是哪个国家拖累的？
    inject: {drop_country: EIRE, week: "2011-W31"}
    must_mention:
      - ["EIRE", "爱尔兰"]
