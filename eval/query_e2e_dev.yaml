# 端到端评测的开发题（M19b）：写取数工具的说明和提示词时用，成绩不算数。格式同 query_e2e.yaml。
domain: ecommerce
cases:
  - id: dev-month-aov
    category: 取数：按月
    # 2011 年客单价最高的月份是 2011-12（只到 12-09），753.05；其次 2011-01，620.15
    question: 2011 年哪个月的客单价最高？是多少？
    expects_skill: false
    must_mention:
      - ["12 月", "12月", "2011-12"]
    expect_sql:
      - SELECT sum(amount) / count(DISTINCT invoice) AS aov FROM sales WHERE strftime(invoice_date, '%Y-%m') = '2011-12'

  - id: dev-top-customer
    category: 取数：客户排名
    # 2011 年下单次数最多的客户 14911，185 单
    question: 2011 年下单次数最多的客户是谁？下了多少单？
    expects_skill: false
    must_mention:
      - ["14911"]
    expect_sql:
      - SELECT count(DISTINCT invoice) AS orders FROM sales WHERE year(invoice_date) = 2011 AND customer_id = '14911'

  - id: dev-nov-countries
    category: 取数：国家排名（并列）
    # 2011-11 英国以外订单最多：法国、德国并列 64 单
    question: 2011 年 11 月，英国以外哪个国家的订单最多？有多少单？
    expects_skill: false
    must_mention:
      - ["France", "法国"]
      - ["Germany", "德国"]
    expect_sql:
      - SELECT count(DISTINCT invoice) AS orders FROM sales WHERE strftime(invoice_date, '%Y-%m') = '2011-11' AND country = 'France'
