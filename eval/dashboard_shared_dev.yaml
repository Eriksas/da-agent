# M23 的开发题：调通评分和流程时用，成绩不算数。主题和留出题（dashboard_shared.yaml）不同。
domain: ecommerce
cases:
  - id: dev-shared-cancel
    category: 要看板（开发题）
    question: 给客服主管搭一个看板，看每周的取消金额和取消率，以及哪些国家取消得多。
    expects_skill: false
    require_tools: [build_dashboard]
    dashboard_metrics: [cancelled_amount, cancel_rate]
    must_mention:
      - ["dashboard.html"]
