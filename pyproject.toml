[project]
name = "da-agent"
version = "0.1.0"
description = "运营周报与指标异动分析 Agent：模型选工具，Python 算数字，报告可核查。"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "duckdb>=1.5.6",
    "markdown>=3.11",
    "openai>=3.20.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
da-agent = "da_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
langgraph = [
    "langgraph>=1.2.14",
]
ui = [
    "streamlit>=1.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/da_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
# E/F 基本错误，I 导入顺序，UP 过时写法，B 常见 bug 写法，RUF100 没用的 noqa
select = ["E", "F", "I", "UP", "B", "RUF100"]
# E501：现有代码的长行（多为中文报错文案）不折行；B905：这里的 zip 都是相邻两项配对，长度本来就差 1
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["da_agent", "helpers", "fixtures_dashboard_spec"]

[tool.coverage.run]
omit = ["src/da_agent/ui_app.py"]  # Streamlit 页面脚本：逻辑在 ui.py 里测，这个文件只负责摆控件
