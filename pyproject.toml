[project]
name = "da-agent"
version = "0.1.0"
description = "运营周报与指标异动分析 Agent：模型选工具，Python 算数字，报告可核查。"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "duckdb>=1.5.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scipy>=1.18.1",
]

[project.scripts]
da-agent = "da_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/da_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
